    <script>
        const canvas = document.getElementById('arrowCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const arrows = [];
        const numArrows = 300;

        for (let i = 0; i < numArrows; i++) {
            arrows.push({
                x: Math.random() * canvas.width * 2,
                y: Math.random() * canvas.height,
                length: Math.random() * 40 + 20,
                speed: Math.random() * 2 + 1,
                opacity: Math.random() * 0.15 + 0.05
            });
        }

        function drawArrow(x, y, length, opacity) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + length, y);
            
            ctx.moveTo(x + length, y);
            ctx.lineTo(x + length - 5, y - 3);
            ctx.moveTo(x + length, y);
            ctx.lineTo(x + length - 5, y + 3);
            
            ctx.moveTo(x, y);
            ctx.lineTo(x + 5, y - 3);
            ctx.moveTo(x, y);
            ctx.lineTo(x + 5, y + 3);

            ctx.strokeStyle = `rgba(139, 125, 107, ${opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numArrows; i++) {
                const arrow = arrows[i];
                drawArrow(arrow.x, arrow.y, arrow.length, arrow.opacity);
                
                arrow.x -= arrow.speed;
                
                if (arrow.x + arrow.length < 0) {
                    arrow.x = canvas.width + Math.random() * 200;
                    arrow.y = Math.random() * canvas.height;
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
